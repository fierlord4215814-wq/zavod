<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Восстановление Завод</title>
  <style>
    :root { color-scheme: dark; --bg:#111827; --panel:#172033; --line:#34435f; --text:#f8fafc; --muted:#b7c2d6; --blue:#3b82f6; --red:#ef4444; --green:#22c55e; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:"Segoe UI", Arial, sans-serif; background:var(--bg); color:var(--text); }
    main { width:min(920px, calc(100vw - 24px)); margin:0 auto; padding:24px 0 40px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px; box-shadow:0 16px 40px rgba(0,0,0,.22); }
    p { color:var(--muted); line-height:1.5; }
    button { border:1px solid transparent; border-radius:8px; padding:11px 14px; cursor:pointer; color:white; font-weight:700; background:var(--blue); }
    button.danger { background:var(--red); }
    input, select { width:100%; border:1px solid var(--line); background:#0f172a; color:var(--text); border-radius:8px; padding:11px 12px; font-size:15px; }
    label { display:flex; flex-direction:column; gap:6px; color:var(--muted); margin:12px 0; }
    .warning { border:1px solid rgba(239,68,68,.6); background:rgba(239,68,68,.12); color:#fecaca; border-radius:8px; padding:12px; }
    .check { border:1px solid var(--line); border-radius:8px; padding:10px; margin:8px 0; }
    .ok { color:var(--green); font-weight:800; }
    .bad { color:var(--red); font-weight:800; }
    .mono { font-family:Consolas, "Courier New", monospace; overflow-wrap:anywhere; }
  </style>
</head>
<body>
  <main>
    <h1>Проверка резервной копии «Завод»</h1>
    <section class="card">
      <div class="warning">
        Восстановление поверх действующей установки отключено. Здесь можно только проверить backup. Для независимого восстановления нужна отдельно подготовленная пустая цель и адресная команда restore-independent.
      </div>
      <label>Backup для проверки<select id="backup"></select></label>
      <button onclick="loadBackups()">Обновить список</button>
      <button onclick="validateBackup()">Проверить backup</button>
      <div id="validate"></div>
    </section>
  </main>
  <script>
    async function api(url, options = {}) {
      const response = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...options });
      return response.json();
    }
    function checksHtml(checks) {
      return (checks || []).map(item => `<div class="check"><span class="${item.ok ? 'ok' : 'bad'}">${item.ok ? 'OK' : 'Ошибка'}</span> <strong>${item.name}</strong><br><span class="mono">${item.details || ''}</span></div>`).join('');
    }
    async function loadBackups() {
      const data = await api('/api/backups');
      const select = document.getElementById('backup');
      select.innerHTML = data.backups.map(item => `<option value="${item.path}">${item.name} · ${item.updatedAt}</option>`).join('');
    }
    async function validateBackup() {
      const backupPath = document.getElementById('backup').value;
      const result = await api('/api/backup-validate', { method: 'POST', body: JSON.stringify({ backupPath }) });
      document.getElementById('validate').innerHTML = checksHtml(result.checks);
    }
    loadBackups();
  </script>
</body>
</html>
