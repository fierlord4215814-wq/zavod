server {
  listen 80;
  server_name _;
  # Backend video limit is 50 MiB; allow bounded multipart overhead at both proxies.
  client_max_body_size 52m;

  root /usr/share/nginx/html;
  index index.html;

  # The only public entrypoint is the separately configured trusted TLS proxy.
  # API and websocket traffic stay inside this Compose network.
  location /api/ {
    proxy_pass http://backend:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /ws {
    proxy_pass http://backend:3000/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 75s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }
}
