<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Завод офлайн</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top left, rgba(37, 99, 235, 0.22), transparent 34rem),
          linear-gradient(180deg, #1e1e2e 0%, #151523 100%);
        color: #e0f2fe;
        font-family: Inter, Arial, sans-serif;
      }
      main {
        width: min(420px, calc(100vw - 32px));
        padding: 24px;
        border: 1px solid rgba(147, 197, 253, 0.26);
        border-radius: 18px;
        background: rgba(30, 41, 59, 0.86);
        box-shadow: 0 20px 54px rgba(2, 6, 23, 0.38);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 22px;
      }
      p {
        margin: 0;
        line-height: 1.5;
      }
      button {
        min-height: 46px;
        margin-top: 18px;
        border: 1px solid rgba(147, 197, 253, 0.42);
        border-radius: 14px;
        background: linear-gradient(180deg, rgba(59, 130, 246, 0.42), rgba(29, 78, 216, 0.38));
        color: #ffffff;
        cursor: pointer;
        font: inherit;
        font-weight: 800;
        padding: 0 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Нет связи</h1>
      <p>Сервер или сеть сейчас недоступны. Проверьте соединение и попробуйте обновить приложение.</p>
      <button type="button" onclick="window.location.reload()">Обновить</button>
    </main>
  </body>
</html>
